name: Release

# Triggers on a `v*.*.*` tag push: typecheck, test, build, then publish to npmjs
# (package.json publishConfig: registry.npmjs.org, public) with npm trusted publishing:
# the job's OIDC token is the credential, so there is no npm token anywhere. The
# package's npmjs settings must list this repository and this workflow file as its
# trusted publisher (npmjs.com → @cboxdk/cbox-ui → Settings → Trusted publishing).

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # npm 11.5+ for trusted publishing; Node 24 ships it.
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Verify package.json version matches the tag
              run: |
                  TAG="${GITHUB_REF##*/}"
                  TAG_VERSION="${TAG#v}"
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag $TAG => $TAG_VERSION but package.json has $PKG_VERSION. Bump the package version before tagging."
                    exit 1
                  fi

            - name: Publish to npmjs (trusted publishing, with provenance)
              run: npm publish --access public --provenance
