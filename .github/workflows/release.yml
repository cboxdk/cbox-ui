name: Release

# Triggers on `v*.*.*` tag push. Builds + publishes to GitHub Packages
# (npm.pkg.github.com) under the @cboxdk scope. Auth uses the
# automatic GITHUB_TOKEN — no manual secret setup required, the token
# inherits the repo's `packages: write` permission below.

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Build
              run: bun run build

            - name: Configure npm auth for GitHub Packages
              run: |
                  echo "@cboxdk:registry=https://npm.pkg.github.com" >> ~/.npmrc
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

            - name: Verify package.json version matches the tag
              run: |
                  TAG="${GITHUB_REF##*/}"
                  TAG_VERSION="${TAG#v}"
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag $TAG => $TAG_VERSION but package.json has $PKG_VERSION. Bump the package version before tagging."
                    exit 1
                  fi

            - name: Publish to GitHub Packages
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
