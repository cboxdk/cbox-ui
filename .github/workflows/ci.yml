name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
            - name: Verify build output exists
              run: |
                  test -f dist/index.js
                  test -f dist/index.d.ts
                  test -f dist/app-switcher.js
                  test -f dist/app-switcher.d.ts
                  # The framework-free entry and the chunks it loads must not import React.
                  ! grep -l "from ['\"]react" dist/app-switcher.js $(grep -o "chunk-[A-Za-z0-9_-]*\.js" dist/app-switcher.js | sed 's|^|dist/|')

    # Visual snapshots and axe (spec §12.3, §12.2) in the pinned Playwright container, the same one
    # `bun run test:visual` uses locally, so the Linux baselines match pixel for pixel.
    visual:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.65.0-noble
            options: --ipc=host
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: Playwright matches the container
              run: test "$(node -p "require('./node_modules/@playwright/test/package.json').version")" = "1.65.0"
            - run: bunx playwright test
              env:
                  CI: '1'
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-diffs
                  path: test-results/
                  retention-days: 7
